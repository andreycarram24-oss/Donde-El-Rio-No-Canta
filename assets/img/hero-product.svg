<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Aurix product dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1824"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c7bff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8c7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <ellipse cx="200" cy="120" rx="380" ry="220" fill="url(#glow)"/>
  <ellipse cx="1100" cy="680" rx="360" ry="200" fill="url(#glow2)"/>

  <!-- window chrome -->
  <rect x="40" y="40" width="1200" height="720" rx="20" fill="#14141f" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="72" cy="72" r="7" fill="#f87171"/>
  <circle cx="94" cy="72" r="7" fill="#facc15"/>
  <circle cx="116" cy="72" r="7" fill="#4ade80"/>
  <rect x="160" y="62" width="320" height="20" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <text x="200" y="76" font-family="Menlo, monospace" font-size="12" fill="#9a98ad">app.aurix.io / agents</text>

  <!-- sidebar -->
  <rect x="60" y="110" width="220" height="630" rx="12" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="80" y="140" width="140" height="14" rx="7" fill="#ffb347" fill-opacity="0.3"/>
  <rect x="80" y="180" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="80" y="210" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="80" y="240" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="80" y="270" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="80" y="320" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="80" y="350" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="80" y="380" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>

  <!-- main panel top cards -->
  <rect x="300" y="110" width="300" height="140" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="320" y="145" font-family="Inter, sans-serif" font-size="13" fill="#9a98ad">Active agents</text>
  <text x="320" y="200" font-family="Instrument Serif, Georgia, serif" font-size="52" fill="#e8e7ef">24</text>
  <text x="320" y="225" font-family="Inter, sans-serif" font-size="12" fill="#4ade80">▲ 8 this week</text>

  <rect x="620" y="110" width="300" height="140" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="640" y="145" font-family="Inter, sans-serif" font-size="13" fill="#9a98ad">Runs today</text>
  <text x="640" y="200" font-family="Instrument Serif, Georgia, serif" font-size="52" fill="#e8e7ef">3,142</text>
  <text x="640" y="225" font-family="Inter, sans-serif" font-size="12" fill="#ffb347">98.7% success</text>

  <rect x="940" y="110" width="260" height="140" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="960" y="145" font-family="Inter, sans-serif" font-size="13" fill="#9a98ad">Time saved</text>
  <text x="960" y="200" font-family="Instrument Serif, Georgia, serif" font-size="52" fill="#e8e7ef">187h</text>
  <text x="960" y="225" font-family="Inter, sans-serif" font-size="12" fill="#9a98ad">this month</text>

  <!-- chart -->
  <rect x="300" y="270" width="620" height="270" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="320" y="305" font-family="Inter, sans-serif" font-size="13" fill="#9a98ad">Agent activity · last 14 days</text>
  <path d="M 320 480 L 360 460 L 400 470 L 440 440 L 480 450 L 520 400 L 560 420 L 600 380 L 640 395 L 680 360 L 720 340 L 760 370 L 800 320 L 840 310 L 880 340 L 900 325 L 900 510 L 320 510 Z" fill="url(#chart)"/>
  <path d="M 320 480 L 360 460 L 400 470 L 440 440 L 480 450 L 520 400 L 560 420 L 600 380 L 640 395 L 680 360 L 720 340 L 760 370 L 800 320 L 840 310 L 880 340 L 900 325" fill="none" stroke="#ffb347" stroke-width="2"/>

  <!-- runs list -->
  <rect x="940" y="270" width="260" height="270" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="960" y="305" font-family="Inter, sans-serif" font-size="13" fill="#9a98ad">Recent runs</text>
  <rect x="960" y="325" width="8" height="8" rx="4" fill="#4ade80"/>
  <text x="976" y="333" font-family="Inter, sans-serif" font-size="12" fill="#e8e7ef">customer-reply · 1.2s</text>
  <rect x="960" y="355" width="8" height="8" rx="4" fill="#4ade80"/>
  <text x="976" y="363" font-family="Inter, sans-serif" font-size="12" fill="#e8e7ef">refund-audit · 860ms</text>
  <rect x="960" y="385" width="8" height="8" rx="4" fill="#facc15"/>
  <text x="976" y="393" font-family="Inter, sans-serif" font-size="12" fill="#e8e7ef">stripe-sync · pending</text>
  <rect x="960" y="415" width="8" height="8" rx="4" fill="#4ade80"/>
  <text x="976" y="423" font-family="Inter, sans-serif" font-size="12" fill="#e8e7ef">weekly-digest · 4.1s</text>
  <rect x="960" y="445" width="8" height="8" rx="4" fill="#4ade80"/>
  <text x="976" y="453" font-family="Inter, sans-serif" font-size="12" fill="#e8e7ef">onboarding · 2.8s</text>

  <!-- bottom rows -->
  <rect x="300" y="560" width="900" height="50" rx="12" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="320" y="578" width="180" height="14" rx="4" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="540" y="578" width="140" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="720" y="578" width="100" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="1080" y="578" width="100" height="14" rx="7" fill="#ffb347" fill-opacity="0.25"/>

  <rect x="300" y="625" width="900" height="50" rx="12" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="320" y="643" width="220" height="14" rx="4" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="560" y="643" width="120" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="720" y="643" width="140" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="1080" y="643" width="100" height="14" rx="7" fill="#4ade80" fill-opacity="0.25"/>

  <rect x="300" y="690" width="900" height="50" rx="12" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="320" y="708" width="160" height="14" rx="4" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="500" y="708" width="180" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="720" y="708" width="110" height="14" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="1080" y="708" width="100" height="14" rx="7" fill="#8c7bff" fill-opacity="0.3"/>
</svg>
